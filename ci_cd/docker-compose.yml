services:
  api:
    build:
      context: ..
      dockerfile: ci_cd/Dockerfile

    container_name: videofactory-api

    env_file:
      - ../.env

    command: python3.11 -m uvicorn app.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    volumes:
      - ../shorts/chess:/app/shorts/chess

    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: ci_cd/Dockerfile

    container_name: videofactory-worker

    env_file:
      - ../.env

    command: python3.11 -m app.worker

    volumes:
      - ../shorts/chess:/app/shorts/chess

    restart: unless-stopped

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    container_name: jenkins

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
